<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prode Toros 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg-body:    #0d1117;
            --bg-card:    #161b22;
            --border:     #30363d;
            --cyan:       #00e5ff;
            --pink:       #ff4081;
            --violet:     #b388ff;
            --text:       #f0f6fc;
            --muted:      #8b949e;
            --gold:       #ffd700;
            --silver:     #c0c0c0;
            --bronze:     #cd7f32;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg-body);
            color: var(--text);
            margin: 0;
            padding: 16px;
        }

        /* ── HEADER ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header h1 {
            margin: 0;
            font-size: 1.3rem;
            color: var(--cyan);
            letter-spacing: 1px;
        }
        .last-updated {
            font-size: 0.78rem;
            color: var(--muted);
        }

        /* ── TABS ── */
        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: none;
            border: none;
            color: var(--muted);
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            border-bottom: 3px solid transparent;
            transition: all .25s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .tab-btn:hover { color: var(--text); background: rgba(255,255,255,.04); border-radius: 6px 6px 0 0; }
        .tab-btn.active { color: var(--cyan); border-bottom-color: var(--cyan); }

        .tab-content { display: none; animation: fadeIn .3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

        /* ── SCOREBOARD ── */
        .chart-wrap {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            height: 80vh;
            min-height: 600px;
        }

        /* ── RANKING TABLE ── */
        .ranking-wrap {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        .ranking-wrap h3 {
            text-align: center;
            color: var(--cyan);
            margin: 0 0 14px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .rank-table {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            border-collapse: collapse;
            font-size: .9rem;
        }
        .rank-table thead tr { background: rgba(0,229,255,.08); color: var(--cyan); }
        .rank-table th, .rank-table td { padding: 8px 12px; text-align: center; }
        .rank-table tbody tr { border-bottom: 1px solid var(--border); }
        .rank-table tbody tr:nth-child(even) { background: rgba(255,255,255,.02); }
        .rank-table tbody tr.gold-row   { color: var(--gold);   font-weight: bold; }
        .rank-table tbody tr.silver-row { color: var(--silver); font-weight: bold; }
        .rank-table tbody tr.bronze-row { color: var(--bronze); font-weight: bold; }
        .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }

        /* ── PREDICCIONES ── */
        .pred-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }
        @media (max-width: 1000px) { .pred-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px)  { .pred-grid { grid-template-columns: 1fr; } }

        .match-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
        }
        .card-title {
            text-align: center;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px;
            margin-bottom: 16px;
            background: rgba(0,0,0,.2);
        }
        .card-title h2 { margin:0; font-size:1rem; text-transform:uppercase; }
        .card-body { display:flex; gap:14px; }

        .col-scores { flex: 1.2; display:flex; flex-direction:column; gap:9px; }
        .col-donut  { flex:1; display:flex; flex-direction:column; align-items:center; border-left:1px solid var(--border); padding-left:14px; }

        .col-label { text-align:center; font-size:.75rem; color:var(--muted); margin-bottom:10px; text-transform:uppercase; letter-spacing:.8px; }

        .score-box {
            border: 2px solid;
            border-radius: 8px;
            padding: 8px 10px;
            text-align: center;
            position: relative;
        }
        .score-box.local { border-color: var(--cyan); }
        .score-box.away  { border-color: var(--pink); }
        .score-box.tie   { border-color: var(--violet); }
        .score-box h3      { margin:0; font-size:1.3rem; }
        .score-box .votes  { font-size:.75rem; font-weight:bold; margin:2px 0 4px; }
        .score-box .names  { font-size:.68rem; color:var(--muted); line-height:1.3; }

        .medals { position:absolute; top:-8px; right:-8px; display:flex; gap:3px; }
        .medal  { width:17px; height:17px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.6rem; font-weight:bold; color:#000; box-shadow:0 2px 4px rgba(0,0,0,.5); }
        .medal-1 { background:var(--gold);   }
        .medal-2 { background:var(--silver); }
        .medal-3 { background:var(--bronze); }

        /* Donut */
        .donut-wrap { position:relative; width:110px; height:110px; margin:12px 0; }
        .donut-chart { width:100%; height:100%; border-radius:50%; }
        .donut-hole  { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:60px; height:60px; background:var(--bg-card); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.95rem; font-weight:bold; }
        .legend { font-size:.72rem; text-align:center; margin-top:8px; display:flex; flex-direction:column; gap:4px; }
        .legend span { display:flex; align-items:center; justify-content:center; }
        .legend-dot { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; }
        .local-dot { background:var(--cyan); }
        .away-dot  { background:var(--pink); }
        .tie-dot   { background:var(--violet); }

        @media (max-width:1100px) {
            .card-body { flex-direction:column; }
            .col-donut { border-left:none; border-top:1px solid var(--border); padding-left:0; padding-top:12px; }
        }

        /* ── EMPTY / LOADING ── */
        .empty-msg { text-align:center; color:var(--muted); padding:60px 20px; font-size:1.1rem; }
        #loading   { text-align:center; padding:80px; color:var(--muted); font-size:1.1rem; }
        .spinner   { display:inline-block; width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--cyan); border-radius:50%; animation:spin .7s linear infinite; margin-right:10px; vertical-align:middle; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>

<div id="loading"><span class="spinner"></span>Cargando datos...</div>

<div id="app" style="display:none">
    <div class="header">
        <h1>PRODE TOROS 2026</h1>
        <span class="last-updated" id="last-updated"></span>
    </div>

    <div class="tabs" id="tabs">
        <button class="tab-btn active" data-tab="tab-scoreboard">Evolución Puntos</button>
        <button class="tab-btn" data-tab="tab-predictions" id="pred-tab-btn">Predicciones</button>
    </div>

    <!-- TAB 1: SCOREBOARD -->
    <div id="tab-scoreboard" class="tab-content active">
        <div class="chart-wrap">
            <canvas id="evolutionChart"></canvas>
        </div>
        <div class="ranking-wrap">
            <h3>Tabla de Posiciones</h3>
            <table class="rank-table">
                <thead><tr><th>#</th><th>Jugador</th><th>Puntos</th></tr></thead>
                <tbody id="ranking-tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- TAB 2: PREDICCIONES -->
    <div id="tab-predictions" class="tab-content">
        <div class="pred-grid" id="pred-grid"></div>
        <div id="pred-empty" class="empty-msg" style="display:none">
            No hay partidos próximos cargados todavía.
        </div>
    </div>
</div>

<script>
// ── Tab switching ──────────────────────────────────────────────────
document.getElementById('tabs').addEventListener('click', e => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
});

// ── Helpers ───────────────────────────────────────────────────────
function resultClass(score) {
    const [l, v] = score.split('-').map(Number);
    if (l > v) return 'local';
    if (l < v) return 'away';
    return 'tie';
}

function medalsHTML(voters, top3) {
    return voters
        .filter(v => top3[v])
        .map(v => `<div class="medal medal-${top3[v]}">${top3[v]}</div>`)
        .join('');
}

// ── Render ranking table ───────────────────────────────────────────
function renderRanking(ranking, colors) {
    const rowClasses = ['gold-row', 'silver-row', 'bronze-row'];
    const tbody = document.getElementById('ranking-tbody');
    tbody.innerHTML = ranking.map(r => {
        const cls = r.pos <= 3 ? rowClasses[r.pos - 1] : '';
        const color = colors[r.name] || '#888';
        return `<tr class="${cls}">
            <td>${r.pos}</td>
            <td><span class="dot" style="background:${color}"></span>${r.name}</td>
            <td><strong>${r.pts}</strong></td>
        </tr>`;
    }).join('');
}

// ── Render evolution chart ─────────────────────────────────────────
let chartInstance = null;
function renderChart(data) {
    if (chartInstance) { chartInstance.destroy(); }

    const labels = ['Inicio', ...data.matches_played];
    const datasets = data.players.map(name => ({
        label: name,
        data: data.history[name],
        borderColor: data.colors[name] || '#fff',
        backgroundColor: data.colors[name] || '#fff',
        tension: 0.1,
        pointRadius: 2,
        pointHoverRadius: 5,
    }));

    const drawNamesPlugin = {
        id: 'drawNames',
        afterDraw(chart) {
            const { ctx, chartArea: { right }, scales: { y } } = chart;
            ctx.save();
            ctx.font = 'bold 13px sans-serif';
            ctx.textBaseline = 'middle';

            const groups = {};
            chart.data.datasets.forEach(ds => {
                const val = ds.data[ds.data.length - 1];
                if (!groups[val]) groups[val] = [];
                groups[val].push({ name: ds.label, color: ds.borderColor });
            });

            const MIN_GAP = 20;
            const positions = Object.keys(groups)
                .sort((a, b) => b - a)
                .map(score => ({
                    score,
                    targetY: y.getPixelForValue(+score),
                    actualY: y.getPixelForValue(+score),
                    items: groups[score],
                }));

            let prevY = -999;
            positions.forEach(pos => {
                if (pos.targetY < prevY + MIN_GAP) pos.actualY = prevY + MIN_GAP;
                prevY = pos.actualY;
            });

            positions.forEach(pos => {
                let x = right + 16;
                if (Math.abs(pos.targetY - pos.actualY) > 2) {
                    ctx.beginPath();
                    ctx.moveTo(right, pos.targetY);
                    ctx.lineTo(right + 10, pos.actualY);
                    ctx.strokeStyle = 'rgba(139,148,158,.4)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
                pos.items.forEach((item, idx) => {
                    ctx.fillStyle = item.color;
                    ctx.fillText(item.name, x, pos.actualY);
                    x += ctx.measureText(item.name).width;
                    if (idx < pos.items.length - 1) {
                        ctx.fillStyle = '#8b949e';
                        ctx.fillText(' / ', x, pos.actualY);
                        x += ctx.measureText(' / ').width;
                    } else {
                        ctx.fillStyle = '#8b949e';
                        ctx.fillText(` (${pos.score})`, x, pos.actualY);
                    }
                });
            });
            ctx.restore();
        }
    };

    const ctx = document.getElementById('evolutionChart').getContext('2d');
    chartInstance = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            layout: { padding: { right: 340 } },
            scales: {
                y: {
                    beginAtZero: true,
                    grid:  { color: 'rgba(255,255,255,.08)' },
                    ticks: { color: '#8b949e' },
                },
                x: {
                    grid:  { display: false },
                    ticks: { color: '#8b949e', maxRotation: 45, minRotation: 45 },
                },
            },
            plugins: {
                legend: { display: false },
                tooltip: {
                    mode: 'index',
                    intersect: false,
                    backgroundColor: 'rgba(22,27,34,.95)',
                    titleColor: '#f1c40f',
                    bodyColor: '#fff',
                    borderColor: '#30363d',
                    borderWidth: 1,
                    callbacks: {
                        afterBody(items) {
                            const sorted = [...items].sort((a, b) => b.raw - a.raw);
                            return sorted.map((it, i) => `  ${i+1}. ${it.dataset.label}: ${it.raw}`);
                        }
                    }
                },
            },
        },
        plugins: [drawNamesPlugin],
    });
}

// ── Render predictions tab ─────────────────────────────────────────
function renderPredictions(upcoming, top3) {
    const grid  = document.getElementById('pred-grid');
    const empty = document.getElementById('pred-empty');
    const tabBtn = document.getElementById('pred-tab-btn');

    if (!upcoming || upcoming.length === 0) {
        grid.style.display = 'none';
        empty.style.display = 'block';
        tabBtn.textContent = 'Predicciones';
        return;
    }

    // Detectar fase actual
    const phase = upcoming[0].phase;
    tabBtn.textContent = `Predicciones — ${phase}`;

    grid.innerHTML = upcoming.map(match => {
        const [teamA, teamB] = match.match.split(' vs ');
        let votesLocal = 0, votesTie = 0, votesAway = 0;
        const TOTAL = 16;

        const boxesHTML = match.predictions.map(pred => {
            const cls = resultClass(pred.score);
            if (cls === 'local') votesLocal += pred.count;
            else if (cls === 'away') votesAway += pred.count;
            else votesTie += pred.count;

            const meds = medalsHTML(pred.voters, top3);
            return `<div class="score-box ${cls}">
                ${meds ? `<div class="medals">${meds}</div>` : ''}
                <h3>${pred.score}</h3>
                <div class="votes">${pred.count}v</div>
                <div class="names">${pred.voters.join(', ')}</div>
            </div>`;
        }).join('');

        const pL  = (votesLocal / TOTAL) * 100;
        const pT  = (votesTie  / TOTAL) * 100;
        const pA  = (votesAway / TOTAL) * 100;
        const conic = `conic-gradient(var(--cyan) 0% ${pL}%, var(--violet) ${pL}% ${pL+pT}%, var(--pink) ${pL+pT}% 100%)`;

        return `<div class="match-card">
            <div class="card-title"><h2>${match.match}</h2></div>
            <div class="card-body">
                <div class="col-scores">
                    <div class="col-label">Marcadores</div>
                    <div style="display:flex;flex-direction:column;gap:9px">${boxesHTML}</div>
                </div>
                <div class="col-donut">
                    <div class="col-label">¿Quién gana?</div>
                    <div class="donut-wrap">
                        <div class="donut-chart" style="background:${conic}"></div>
                        <div class="donut-hole">${TOTAL}v</div>
                    </div>
                    <div class="legend">
                        ${votesLocal > 0 ? `<span><span class="legend-dot local-dot"></span>${teamA} (${votesLocal})</span>` : ''}
                        ${votesTie  > 0 ? `<span><span class="legend-dot tie-dot"></span>Empate (${votesTie})</span>` : ''}
                        ${votesAway > 0 ? `<span><span class="legend-dot away-dot"></span>${teamB} (${votesAway})</span>` : ''}
                    </div>
                </div>
            </div>
        </div>`;
    }).join('');
}

// ── Main: fetch data and render ────────────────────────────────────
fetch('./data.json')
    .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
    })
    .then(data => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('last-updated').textContent = `Actualizado: ${data.last_updated}`;

        renderRanking(data.ranking, data.colors);
        renderChart(data);
        renderPredictions(data.upcoming, data.top3);
    })
    .catch(err => {
        document.getElementById('loading').innerHTML =
            `<p style="color:#ff4081">Error al cargar datos.<br><small>${err.message}</small></p>`;
    });
</script>
</body>
</html>
